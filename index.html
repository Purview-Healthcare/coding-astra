    if (min < 5)

    if (min < 60)
        return `${min} minutes ago`;
    const midnight = new Date(now);

    const m = midnight.getTime();
    if (prev >= m)
        return "earlier today";
    if (prev >= m - 86400000)
        return "yesterday";
    const days = Math.floor((m - prev) / 86400000) + 1;
    if (days < 7)
        return `${days} days ago`;
    return "on " + new Date(prev).toLocaleDateString("en-US", { month: "short", day: "numeric" });

    if (table)
        pool = pool.filter((x) => x.table === table);
    if (!pool.length)
        return null;
    const sorted = pool.slice().sort((a, b) => (b.effective || 0) - (a.effective || 0));
    if (!dos)
        return sorted[0];
    const onOrBefore = sorted.filter((x) => x.effective && x.effective <= dos);
    // A date older than everything loaded falls back to the oldest held,
    // flagged so nobody mistakes it for an exact match.
    if (!onOrBefore.length)
        return { ...sorted[sorted.length - 1], tooOld: true };
