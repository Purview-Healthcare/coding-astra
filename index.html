async function aiViaSheet(payload) {

        throw new Error("no answer came back — try rephrasing");

function extractJson(raw) {
    const clean = raw.replace(/```json|```/g, "").trim();
    const start = clean.indexOf("{");
    if (start === -1)
        return null;
    const s = clean.slice(start);
    const end = s.lastIndexOf("}");
    if (end !== -1) {
        try {
            return JSON.parse(s.slice(0, end + 1).replace(/,\s*([}\]])/g, "$1"));
        }
        catch (e) { /* repair below */ }
    }
    let out = "";
    const stack = [];
    let inStr = false, esc = false;
    for (const ch of s) {
        if (inStr) {
            out += ch;
            if (esc)
                esc = false;
            else if (ch === "\\")
                esc = true;
            else if (ch === '"')
                inStr = false;
            continue;
        }
        if (ch === '"') {
            inStr = true;
            out += ch;
            continue;
        }
        if (ch === "{" || ch === "[")
            stack.push(ch);
        if (ch === "}" || ch === "]")
            stack.pop();
        out += ch;
    }
    if (inStr)
        out += '"';
    out = out.replace(/,\s*$/, "");
    while (stack.length)
        out += stack.pop() === "{" ? "}" : "]";
    out = out.replace(/,\s*([}\]])/g, "$1");
    try {
        return JSON.parse(out);
    }
    catch (e) {
        return null;
    }
}
